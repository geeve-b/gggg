<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why You're My Queen</title><link rel="stylesheet" href="css/style.css"></head><body data-page="4"><div class="progress" data-progress></div><div class="topbar"><span class="brand">✦ Queen's Hall</span><span class="progress-label" data-progress-label></span><button class="music" data-music>🔇</button></div><main class="page"><div class="crown">♕</div><h2 data-heading></h2><p class="subtitle" data-subtitle></p><div class="reason-card glass" data-card>Every queen has a story...</div><div class="counter" data-counter>Ready when you are</div><button class="btn" data-reveal>REVEAL A REASON 💖</button><a class="btn hidden" data-letter href="letter.html">READ YOUR LOVE LETTER 💌</a></main><script src="js/content.js"></script><script src="js/script.js"></script><script>let n=0;const card=document.querySelector('[data-card]'),counter=document.querySelector('[data-counter]'),reveal=document.querySelector('[data-reveal]'),next=document.querySelector('[data-letter]');reveal.onclick=()=>{card.classList.remove('reveal');void card.offsetWidth;card.classList.add('reveal');card.textContent=princessContent.queenReasons[n];n++;counter.textContent=`${n} of ${princessContent.queenReasons.length}`;if(n===princessContent.queenReasons.length){reveal.classList.add('hidden');card.textContent='YOU ARE TRULY ONE OF A KIND, MY QUEEN 👑';next.classList.remove('hidden')}};document.querySelector('[data-heading]').textContent=princessContent.queenHeading;document.querySelector('[data-subtitle]').textContent=princessContent.queenSubtitle;</script></body></html>
