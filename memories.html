<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beautiful Memories</title><link rel="stylesheet" href="css/style.css"></head><body data-page="3"><div class="progress" data-progress></div><div class="topbar"><span class="brand">✦ Memory Gallery</span><span class="progress-label" data-progress-label></span><button class="music" data-music>🔇</button></div><main class="page"><p class="eyebrow">A gallery for <span data-name></span></p><h2 data-heading></h2><p class="subtitle" data-subtitle></p><div class="gallery" data-gallery></div><a class="btn" href="princess.html">CONTINUE THE JOURNEY ✨</a></main><div class="lightbox hidden" data-lightbox><button class="close" data-close>×</button><button class="btn" data-prev>‹</button><img alt=""><button class="btn" data-next>›</button></div><script src="js/content.js"></script><script src="js/script.js"></script><script>const gallery=document.querySelector('[data-gallery]'),light=document.querySelector('[data-lightbox]'),lightImg=light.querySelector('img');let current=0;princessContent.memories.forEach((m,i)=>{const f=document.createElement('figure');f.className='memory glass';f.innerHTML=`<img src="${m.image}" alt="${m.caption}"><figcaption><strong>${m.caption}</strong><small>${m.description}</small></figcaption>`;f.onclick=()=>{current=i;lightImg.src=m.image;light.classList.remove('hidden')};gallery.append(f)});document.querySelector('[data-name]').textContent=princessContent.princessName;document.querySelector('[data-heading]').textContent=princessContent.memoriesHeading;document.querySelector('[data-subtitle]').textContent=princessContent.memoriesSubtitle;document.querySelector('[data-close]').onclick=()=>light.classList.add('hidden');document.querySelector('[data-prev]').onclick=()=>{current=(current-1+princessContent.memories.length)%princessContent.memories.length;lightImg.src=princessContent.memories[current].image};document.querySelector('[data-next]').onclick=()=>{current=(current+1)%princessContent.memories.length;lightImg.src=princessContent.memories[current].image};</script></body></html>
